services:
  - type: web
    name: anki-card-agent
    runtime: python
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # 部署时在 Render 控制台手动填写
      - key: PYTHON_VERSION
        value: "3.13.0"
    healthCheckPath: /
