services:
  - type: web
    name: anki-card-agent
    runtime: python
    buildCommand: pip install uv && uv sync --frozen && npm install -g @anthropic-ai/claude-code
    startCommand: uv run uvicorn web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # 填写您的智谱 AI API Key
      - key: ANTHROPIC_BASE_URL
        value: "https://open.bigmodel.cn/api/anthropic"  # 智谱 AI 兼容接口
      - key: MODEL
        value: "glm-4.7"
      - key: PYTHON_VERSION
        value: "3.13.0"
    healthCheckPath: /

